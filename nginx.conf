server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;

  location ~* \.(?:css|js|jpg|jpeg|png|svg|webp|woff2?)$ {
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }
}
